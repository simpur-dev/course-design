[project]
name = "yinju"
version = "0.1.0"
description = "CitationProof: a claim-evidence workbench backed by seekdb and PowerContext"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyseekdb==1.4.0.post1",
  "pymysql>=1.1,<2",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "typer>=0.16,<1",
  "pymupdf>=1.24,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pyyaml>=6,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
yinju = "yinju.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yinju"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
