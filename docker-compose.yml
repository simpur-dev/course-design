name: course-design

services:
  seekdb:
    image: quay.io/oceanbase/seekdb@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    ports:
      - "127.0.0.1:${APP_SEEKDB_PORT:-2881}:2881"
    environment:
      MEMORY_LIMIT: 2G
    volumes:
      - seekdb-data:/var/lib/seekdb
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h127.0.0.1 -P2881 -uroot --connect-timeout=3 -s
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  powercontext:
    image: ${APP_POWERCONTEXT_IMAGE:-course-design-powercontext:1.4.0}
    build:
      context: ./deploy/powercontext
    ports:
      - "127.0.0.1:${APP_POWERCONTEXT_PORT:-8000}:8000"
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
    volumes:
      - powercontext-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 30

volumes:
  seekdb-data:
  powercontext-data:
